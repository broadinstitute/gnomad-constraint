name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      # .Rprofile activates the repo's renv project, so without this,
      # setup-r-dependencies installs pak into the renv library it caches. The
      # cache key doesn't include the pak version, so after a pak release a
      # restored cache links to a pak that isn't installed, and the step fails
      # with "there is no package called 'pak'".
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-
      - name: Install Python dependencies
        run: |
          pip install wheel
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          packages: |
            any::lintr
            any::styler
      - name: Check formatting
        run: black --check --preview gnomad_constraint
      - name: Check imports
        run: isort --check-only gnomad_constraint
      - name: Check docstrings
        run: pydocstyle
      - name: Check comment formatting
        run: autopep8 --exit-code --diff gnomad_constraint
      - name: Run Pylint
        run: PYTHONPATH=$(pwd):$PYTHONPATH pylint --disable=W gnomad_constraint
      - name: Run styler
        run: Rscript -e "styler::style_dir('gnomad_constraint/plots/')"
      - name: Run lintr
        run: Rscript -e "lintr::lint_dir('gnomad_constraint/plots/', pattern='.R$')"
