name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests start Hail, whose bundled Spark and Hadoop jars fail on the
      # runner's default Java (23+); use Java 11.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Use pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-
      - name: Install Python dependencies
        run: |
          pip install wheel
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::lintr
            any::styler
      - name: Source renv activate
        run: Rscript -e 'source("gnomad_constraint/renv/activate.R")'
      - name: Check formatting
        run: black --check --preview gnomad_constraint tests
      - name: Check imports
        run: isort --check-only gnomad_constraint tests
      - name: Check docstrings
        run: pydocstyle
      - name: Check comment formatting
        run: autopep8 --exit-code --diff gnomad_constraint tests
      - name: Run Pylint
        run: PYTHONPATH=$(pwd):$PYTHONPATH pylint --disable=W gnomad_constraint
      - name: Run tests
        run: python -m pytest
      - name: Check the pipeline flowchart matches the code
        run: PYTHONPATH=$(pwd):$PYTHONPATH python -m gnomad_constraint.flowchart.generate_flowchart --check
      - name: Run styler
        run: Rscript -e "styler::style_dir('gnomad_constraint/plots/')"
      - name: Run lintr
        run: Rscript -e "lintr::lint_dir('gnomad_constraint/plots/', pattern='.R$')"
